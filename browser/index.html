<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Newly</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #1e2227; color: #e8eaed; }
  #bar { display: flex; gap: 6px; padding: 10px; height: 44px; box-sizing: border-box; }
  #bar button { background: #2a3038; color: #e8eaed; border: 0; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; }
  #tabs { display: flex; gap: 4px; padding: 0 10px; height: 28px; }
  .tab { background: #2a3038; padding: 3px 10px; border-radius: 6px 6px 0 0; cursor: pointer;
    max-width: 180px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab.active { background: #3a4250; }
  #url { flex: 1; background: #2a3038; border: 0; border-radius: 6px; padding: 6px 12px;
    color: #e8eaed; outline: none; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="bar">
    <button id="back" title="terug (fase 1)">&larr;</button>
    <input id="url" placeholder="Adres of zoekterm" spellcheck="false">
    <button id="go">Ga</button>
    <button id="new">+ Tab</button>
  </div>
  <script>
    const api = window.nieuw;
    const tabsEl = document.getElementById('tabs');
    const urlEl = document.getElementById('url');

    api.onInfo(function (info) {
      tabsEl.innerHTML = '';
      for (let k = 0; k < info.count; k++) {
        const t = document.createElement('span');
        t.className = 'tab' + (k === info.active ? ' active' : '');
        t.textContent = info.title || 'Tab ' + (k + 1);
        t.onclick = function () { api.activate(k); };
        t.oncontextmenu = function (ev) { ev.preventDefault(); api.closeTab(k); };
        tabsEl.appendChild(t);
      }
      if (info.i === info.active) {
        urlEl.value = info.url || '';
        document.title = info.title || 'Newly';
      }
    });

    function go() {
      let v = urlEl.value.trim();
      if (!v) return;
      if (v.indexOf('http') !== 0 && v.indexOf('://') < 0 && v.indexOf('about:') !== 0) v = 'https://' + v;
      api.navigate(v);
    }
    document.getElementById('go').onclick = go;
    document.getElementById('new').onclick = function () { api.newTab(null); };
    urlEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  </script>
</body>
</html>
